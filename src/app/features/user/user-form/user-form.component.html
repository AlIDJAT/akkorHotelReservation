<mat-card>
    <mat-card-title>
      {{ isEditMode ? 'Edit User' : 'Create New User' }}
    </mat-card-title>
  
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
        <mat-error *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
          A valid email is required.
        </mat-error>
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Pseudo</mat-label>
        <input matInput formControlName="pseudo">
        <mat-error *ngIf="userForm.get('pseudo')?.invalid && userForm.get('pseudo')?.touched">
          Pseudo is required.
        </mat-error>
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password">
        <mat-error *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
          Password is required.
        </mat-error>
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option value="USER">User</mat-option>
          <mat-option value="ADMIN">Admin</mat-option>
        </mat-select>
        <mat-error *ngIf="userForm.get('role')?.invalid && userForm.get('role')?.touched">
          Role is required.
        </mat-error>
      </mat-form-field>
  
      <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">
        {{ isEditMode ? 'Update User' : 'Create User' }}
      </button>
    </form>
  </mat-card>
