<div class="user-list-container">
    <h2>List of Users</h2>
  
    <div *ngIf="isLoading">Loading users...</div>
  
    <!-- Bouton "Add User" visible seulement si admin (optionnel) -->
    <button mat-raised-button color="accent" *ngIf="isAdmin()" (click)="onEditUser(0)">
      Create new User
    </button>
  
    <div class="card-grid">
      <mat-card class="user-card" *ngFor="let user of users">
        <mat-card-title>{{ user.email }}</mat-card-title>
        <mat-card-content>
          Pseudo: {{ user.pseudo }}
        </mat-card-content>
  
        <mat-card-actions>
          <button mat-button color="primary" *ngIf="isAdmin()" (click)="onEditUser(user.id!)">
            Edit
          </button>
          <button mat-button color="warn" *ngIf="isAdmin()" (click)="onDeleteUser(user.id!)">
            Delete
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
