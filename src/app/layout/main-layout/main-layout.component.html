<!-- Barre d’outils en haut -->
<mat-toolbar color="primary" class="top-toolbar">
  <!-- Bouton burger pour ouvrir/fermer la side nav -->
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">Akkor Hotel</span>
  <span class="spacer"></span>
  <span *ngIf="authService.isAuthenticated()">
    Bonjour, {{ authService.getUserPseudo() }}!
  </span>

  <!-- Bouton Logout si authentifié -->
  <button mat-button *ngIf="isAuthenticated()" (click)="logout()">
    Logout
  </button>
</mat-toolbar>

<!-- Le conteneur principal -->
<mat-sidenav-container class="layout-container">
  <!-- Barre latérale -->
  <mat-sidenav #sidenav mode="side" [(opened)]="opened" class="side-nav">
 

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" (click)="sidenav.close()">
        Dashboard
      </a>
      <a mat-list-item routerLink="/hotels" (click)="sidenav.close()">
        Hôtels disponibles
      </a>
      <a mat-list-item routerLink="/users" *ngIf="isAdmin()" (click)="sidenav.close()">
        Users
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenu principal -->
  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
